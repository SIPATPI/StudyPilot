<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StudyPilot — Study Planner</title><style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#1b2340;--muted:#69738b;--accent:#594bd8;--line:#e5e8f1;--green:#167851;--soft:#eeecff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif}button,input,select{font:inherit}button{cursor:pointer}button,select,input{min-height:44px}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #9a8dfb;outline-offset:2px}button{border:0;border-radius:11px;padding:10px 15px;background:var(--soft);color:#4234b1;font-weight:650}button.primary{background:var(--accent);color:white}button.subtle{background:#f4f5f9;color:var(--ink)}button.danger{color:#a12d39;background:#fff0f1}button:disabled{opacity:.5}aside{position:fixed;left:0;top:0;bottom:0;width:224px;background:#202342;color:white;padding:28px 18px;display:flex;flex-direction:column;gap:10px}.brand{font-size:23px;font-weight:800;letter-spacing:-1px;margin:0 8px 30px}.brand span{color:#b2a7ff}.nav{background:transparent;color:#d9d9ee;text-align:left;width:100%;margin:2px 0}.nav.active{background:#403d78;color:white}.foot{margin-top:auto;color:#b7bbd9;font-size:12px;padding:8px}main{margin-left:224px;max-width:1510px;padding:32px clamp(18px,4vw,52px)}header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:24px}h1,h2,h3,p{margin:0}h1{font-size:32px;letter-spacing:-1px}h2{font-size:19px}h3{font-size:15px}.muted{color:var(--muted)}.eyebrow{font-size:12px;color:var(--accent);font-weight:750;letter-spacing:1px;text-transform:uppercase}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:22px 0}.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:21px;box-shadow:0 4px 18px #20234206}.number{font-size:31px;font-weight:760;letter-spacing:-1px;margin:6px 0}.split{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;margin-bottom:16px}.hero{background:#29264d;color:white;position:relative;overflow:hidden}.hero:after{content:'';position:absolute;width:180px;height:180px;border:24px solid #ffffff0c;border-radius:50%;right:-65px;top:-68px;pointer-events:none}.hero .muted{color:#dddaf3}.hero h2{font-size:24px;margin:6px 0 10px}.hero button{margin-top:18px}.bar{height:9px;border-radius:9px;background:#e9eaf4;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--accent);border-radius:9px}.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:15px}.task{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.task:last-child{border:0}.task input{min-height:0;width:22px;height:22px;accent-color:var(--accent);flex:none;cursor:pointer}.taskinfo{flex:1;min-width:0;overflow-wrap:anywhere}.taskinfo small{color:var(--muted)}.done .taskinfo strong{text-decoration:line-through;color:var(--muted)}.tag{font-size:12px;font-weight:650;padding:4px 9px;border-radius:20px;background:#eeecff;color:#4234b1;white-space:nowrap}.tag.high{background:#fff0e5;color:#a34a16}.tag.low{background:#e9f7f0;color:#167851}.overdue{color:#ae303b!important}.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.tools input{flex:1;min-width:150px}input,select{border:1px solid #d8dce8;background:white;border-radius:10px;padding:10px 12px;color:var(--ink);width:100%}.tools select{width:auto}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.formgrid label{display:block;font-weight:650;font-size:13px}.formgrid label input,.formgrid label select{margin-top:5px}.wide{grid-column:1/-1}dialog{border:1px solid var(--line);border-radius:18px;padding:24px;width:min(520px,calc(100% - 30px));color:var(--ink);box-shadow:0 18px 80px #0003}dialog::backdrop{background:#17193288}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.empty{padding:24px 8px;color:var(--muted);text-align:center}.subject{padding:12px 0;border-bottom:1px solid var(--line)}.subject:last-child{border:0}.between{display:flex;align-items:center;justify-content:space-between;gap:10px}.tiny{font-size:12px}.error{color:#a12d39;font-size:13px;margin-top:8px}.notice{margin:10px 0;color:#a12d39}.subjectname{overflow-wrap:anywhere}.settingsbuttons{display:flex;gap:9px;flex-wrap:wrap}.mobilebrand{display:none}.iconbtn{padding:8px 12px;min-width:44px}.statslabel{font-size:13px;color:var(--muted)}@media(max-width:950px){.cards{grid-template-columns:repeat(2,1fr)}.split{grid-template-columns:1fr}}@media(max-width:680px){aside{position:sticky;top:0;width:100%;height:auto;z-index:2;padding:10px;flex-direction:row;gap:4px;overflow:auto}.brand,.foot{display:none}.nav{font-size:12px;white-space:nowrap;flex:1;text-align:center;padding:8px 10px}main{margin:0;padding:18px 12px}h1{font-size:25px}.card{padding:16px}.cards{gap:8px}.number{font-size:25px}.task{gap:7px;flex-wrap:wrap}.taskinfo{min-width:115px}.tag{font-size:11px}.iconbtn{padding:8px;min-width:44px}.mobilebrand{display:block;font-weight:800;color:var(--accent)}}
</style></head><body><aside><div class="brand">Study<span>Pilot</span></div><button class="nav active" data-page="dashboard">▦ Dashboard</button><button class="nav" data-page="tasks">☑ Tasks</button><button class="nav" data-page="analytics">▥ Analytics</button><button class="nav" data-page="settings">⚙ Settings</button><div class="foot">STUDYPILOT V2<br>Local-first study planner</div></aside><main><div class="mobilebrand">StudyPilot</div><header><div><div class="eyebrow" id="dateLabel"></div><h1 id="pageTitle">Dashboard</h1><p class="muted" id="subtitle">วางแผนวันนี้ให้ชัดเจน</p></div><button class="primary" id="add">＋ เพิ่มงาน</button></header><div id="warning" class="notice" role="status"></div><div id="view"></div></main><dialog id="editor"><form id="taskForm"><div class="sectionhead"><h2 id="editorTitle">เพิ่มงานใหม่</h2><button type="button" class="subtle iconbtn" id="closeEditor" aria-label="ปิด">✕</button></div><div class="formgrid"><label class="wide">ชื่องาน<input name="title" required maxlength="100" placeholder="เช่น ทบทวนบทที่ 3"></label><label>วิชา<input name="subject" required maxlength="50" placeholder="เช่น Mathematics" list="subjects"><datalist id="subjects"></datalist></label><label>วันกำหนดส่ง<input name="due" type="date" required></label><label>ความสำคัญ<select name="priority"><option value="medium">ปานกลาง</option><option value="high">สูง</option><option value="low">ต่ำ</option></select></label><label>เวลาที่วางแผน (นาที)<input name="minutes" type="number" min="5" max="1440" step="5" required value="30"></label></div><div class="actions"><button type="button" class="subtle" id="cancel">ยกเลิก</button><button class="primary" type="submit">บันทึก</button></div></form></dialog><input type="file" id="importFile" accept="application/json,.json" hidden><script>
'use strict';const $=s=>document.querySelector(s);const KEY='studypilot_v2_tasks';let page='dashboard',filter='all',search='',editId=null;const dateKey=(d=new Date())=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;const today=dateKey();const shift=n=>{let d=new Date();d.setDate(d.getDate()+n);return dateKey(d)};const uid=()=>globalThis.crypto?.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36).slice(2);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let tasks=[];let demo=false;const sample=()=>[{id:uid(),title:'ทบทวนสมการกำลังสอง',subject:'Mathematics',due:today,priority:'high',minutes:45,done:false},{id:uid(),title:'ฝึกคำศัพท์ 20 คำ',subject:'Japanese',due:shift(1),priority:'medium',minutes:30,done:false},{id:uid(),title:'อ่านบท Neural Networks',subject:'AI',due:shift(3),priority:'medium',minutes:60,done:false},{id:uid(),title:'สรุปบทเรียนภาษาอังกฤษ',subject:'English',due:shift(-1),priority:'low',minutes:25,done:true}];function warn(s){$('#warning').textContent=s}function load(){try{let raw=localStorage.getItem(KEY);if(raw){let data=JSON.parse(raw);tasks=data.tasks;demo=!!data.demo}else{tasks=sample();demo=true;save()}}catch(e){tasks=[];warn('ไม่สามารถอ่านข้อมูลที่บันทึกไว้ได้ กรุณานำเข้าไฟล์สำรองหากมี')}}function save(){try{localStorage.setItem(KEY,JSON.stringify({tasks,demo}));warn('')}catch(e){warn('บันทึกลงเบราว์เซอร์ไม่ได้ โปรดส่งออกไฟล์ก่อนปิดหน้า')}}const pri={high:'สูง',medium:'ปานกลาง',low:'ต่ำ'};const rank={high:0,medium:1,low:2};const sorted=arr=>[...arr].sort((a,b)=>Number(a.done)-Number(b.done)||a.due.localeCompare(b.due)||rank[a.priority]-rank[b.priority]);const percent=(a,b)=>b?Math.round(a/b*100):0;const duration=n=>n>=60?`${Math.floor(n/60)} ชม. ${n%60?`${n%60} นาที`:''}`:`${n} นาที`;const dateText=s=>new Date(s+'T12:00:00').toLocaleDateString('th-TH',{day:'numeric',month:'short'});const subjects=()=>[...new Set(tasks.map(t=>t.subject))].sort();const remaining=()=>sorted(tasks.filter(t=>!t.done));const dueLabel=t=>t.due<today&&!t.done?'เลยกำหนด · '+dateText(t.due):t.due===today?'วันนี้':dateText(t.due);const bar=p=>`<div class="bar" role="progressbar" aria-valuenow="${p}" aria-valuemin="0" aria-valuemax="100"><i style="width:${p}%"></i></div>`;const empty=s=>`<div class="empty">${s}</div>`;function rows(arr,editable=false){return arr.length?arr.map(t=>`<div class="task ${t.done?'done':''}"><input type="checkbox" aria-label="ทำงาน ${esc(t.title)} เสร็จ" data-toggle="${esc(t.id)}" ${t.done?'checked':''}><div class="taskinfo"><strong>${esc(t.title)}</strong><br><small>${esc(t.subject)} · ${duration(t.minutes)} · <span class="${!t.done&&t.due<today?'overdue':''}">${dueLabel(t)}</span></small></div><span class="tag ${t.priority}">${pri[t.priority]}</span>${editable?`<button class="subtle iconbtn" data-edit="${esc(t.id)}" aria-label="แก้ไขงาน">✎</button><button class="danger iconbtn" data-delete="${esc(t.id)}" aria-label="ลบงาน">×</button>`:''}</div>`).join(''):empty('ยังไม่มีงานในรายการนี้')}
function subjectRows(){return subjects().map(s=>{let ts=tasks.filter(t=>t.subject===s),n=ts.filter(t=>t.done).length,p=percent(n,ts.length);return `<div class="subject"><div class="between"><strong class="subjectname">${esc(s)}</strong><span class="muted tiny">${n}/${ts.length} งาน · ${p}%</span></div>${bar(p)}</div>`}).join('')||empty('เพิ่มงานเพื่อดูความคืบหน้าแต่ละวิชา')}
function render(){let done=tasks.filter(t=>t.done).length,open=remaining(),p=percent(done,tasks.length),total=tasks.reduce((a,t)=>a+t.minutes,0),urgent=open.filter(t=>t.due<=today),focus=urgent[0]||open[0];$('.nav.active')?.classList.remove('active');document.querySelector(`[data-page="${page}"]`).classList.add('active');$('#pageTitle').textContent={dashboard:'Dashboard',tasks:'My Tasks',analytics:'Analytics',settings:'Settings'}[page];$('#subtitle').textContent={dashboard:'วางแผนวันนี้ให้ชัดเจน',tasks:'จัดการงานและแผนอ่านหนังสือ',analytics:'ติดตามความคืบหน้าจากงานของคุณ',settings:'จัดการข้อมูลและไฟล์สำรอง'}[page];$('#dateLabel').textContent=new Date().toLocaleDateString('th-TH',{weekday:'long',day:'numeric',month:'long',year:'numeric'});let html='';if(page==='dashboard'){html=`${demo?'<div class="muted tiny">กำลังแสดงข้อมูลตัวอย่าง — ล้างได้ใน Settings</div>':''}<div class="cards">${[['วิชาทั้งหมด',subjects().length,'Subjects'],['งานที่เสร็จ',`${done}/${tasks.length}`,'Completed'],['เวลาที่วางแผน',duration(total),'Planned time'],['ความคืบหน้า',p+'%','Overall progress']].map(([l,n,s])=>`<div class="card"><div class="statslabel">${l}</div><div class="number">${n}</div><div class="muted tiny">${s}</div></div>`).join('')}</div><div class="split"><section class="card hero"><div class="eyebrow" style="color:#c5baff">TODAY’S FOCUS</div><h2>${focus?esc(focus.title):'ไม่มีงานค้างอยู่'}</h2><p class="muted">${focus?`${esc(focus.subject)} · ${duration(focus.minutes)} · ${dueLabel(focus)}`:'เพิ่มงานใหม่เพื่อเริ่มวางแผนการเรียน'}</p><p class="muted" style="margin-top:10px">${urgent.length?`มี ${urgent.length} งานที่ถึงหรือเลยกำหนด ควรจัดการก่อน`:focus?'เลือกงานที่ใกล้กำหนดส่งที่สุดเพื่อเริ่มต้น':'จัดเวลาพักให้เหมาะสมด้วย'}</p><button class="primary" data-goto="tasks">ดูรายการงาน</button></section><section class="card"><h2>Overall progress</h2><div class="number">${p}%</div>${bar(p)}<p class="muted">${done} งานเสร็จแล้ว · ${open.length} งานที่เหลือ</p><p class="muted tiny" style="margin-top:12px">คำนวณจากจำนวนงานที่ทำเสร็จ</p></section></div><div class="split"><section class="card"><div class="sectionhead"><h2>Upcoming tasks</h2><button data-goto="tasks">ดูทั้งหมด</button></div>${rows(open.slice(0,5))}</section><section class="card"><h2>Subject progress</h2>${subjectRows()}</section></div>`}else if(page==='tasks'){html=`<section class="card"><div class="tools"><input id="search" aria-label="ค้นหางาน" placeholder="ค้นหาชื่องานหรือวิชา" value="${esc(search)}"><select id="filter" aria-label="กรองงาน">${[['all','ทั้งหมด'],['open','ยังไม่เสร็จ'],['done','เสร็จแล้ว'],['today','ถึงหรือเลยกำหนด']].map(([v,l])=>`<option value="${v}" ${v===filter?'selected':''}>${l}</option>`).join('')}</select></div><div id="taskList"></div></section>`}else if(page==='analytics'){let minutesDone=tasks.filter(t=>t.done).reduce((a,t)=>a+t.minutes,0);html=`<div class="cards">${[['งานทั้งหมด',tasks.length],['งานเสร็จแล้ว',done],['เวลาแผนงานที่เสร็จ',duration(minutesDone)],['งานที่ยังค้าง',open.length]].map(([l,n])=>`<div class="card"><div class="statslabel">${l}</div><div class="number">${n}</div></div>`).join('')}</div><div class="split"><section class="card"><h2>ความคืบหน้ารายวิชา</h2>${subjectRows()}</section><section class="card"><h2>เวลาอ่านหนังสือตามแผน</h2>${subjects().map(s=>{let m=tasks.filter(t=>t.subject===s).reduce((a,t)=>a+t.minutes,0);return `<div class="subject"><div class="between"><strong>${esc(s)}</strong><span>${duration(m)}</span></div>${bar(percent(m,total))}</div>`}).join('')||empty('ยังไม่มีข้อมูล')}<p class="muted tiny">แสดงเวลาที่วางแผน ไม่ใช่เวลาที่จับจริง</p></section></div><section class="card"><h2>Study recommendation</h2><p style="margin-top:10px">${urgent.length?`มีงานที่ถึงหรือเลยกำหนด ${urgent.length} งาน เริ่มจากงานที่กำหนดส่งก่อน`:open.length?'ยังไม่มีงานถึงกำหนด ลองแบ่งเวลาให้วิชาที่ยังมีงานค้าง':'เมื่อมีงานใหม่ ให้กำหนดเวลาและความสำคัญเพื่อวางแผน'}</p><p class="muted tiny">คำแนะนำตามกฎ ไม่ได้ใช้ AI API</p></section>`}else{html=`<section class="card"><h2>ข้อมูลของคุณ</h2><p class="muted" style="margin:10px 0 18px">บันทึกในเบราว์เซอร์นี้ ไม่มีบัญชีผู้ใช้หรือการซิงก์ข้ามอุปกรณ์ ควรส่งออกข้อมูลเป็นไฟล์สำรองเป็นประจำ</p><div class="settingsbuttons"><button class="primary" id="export">ส่งออก JSON</button><button id="import">นำเข้า JSON</button><button class="danger" id="reset">ล้างข้อมูลทั้งหมด</button></div><p class="muted tiny" style="margin-top:15px">การนำเข้าจะแทนที่รายการปัจจุบันหลังจากยืนยัน</p></section>`}$('#view').innerHTML=html;if(page==='tasks')renderList()}
function renderList(){let q=search.toLowerCase().trim();let ts=sorted(tasks).filter(t=>(t.title+' '+t.subject).toLowerCase().includes(q)&&(filter==='all'||filter==='open'&&!t.done||filter==='done'&&t.done||filter==='today'&&!t.done&&t.due<=today));$('#taskList').innerHTML=rows(ts,true)}function goto(p){page=p;render()}function openEditor(id){editId=id||null;let t=tasks.find(t=>t.id===id);let f=$('#taskForm');f.reset();f.elements.title.value=t?.title||'';f.elements.subject.value=t?.subject||'';f.elements.due.value=t?.due||today;f.elements.priority.value=t?.priority||'medium';f.elements.minutes.value=t?.minutes||30;$('#editorTitle').textContent=t?'แก้ไขงาน':'เพิ่มงานใหม่';$('#subjects').innerHTML=subjects().map(s=>`<option value="${esc(s)}"></option>`).join('');$('#editor').showModal();f.elements.title.focus()}
$('#add').onclick=()=>openEditor();$('#closeEditor').onclick=$('#cancel').onclick=()=>$('#editor').close();$('#taskForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),old=tasks.find(t=>t.id===editId);let title=f.get('title').trim(),subject=f.get('subject').trim();if(!title||!subject)return;let t={id:editId||uid(),title,subject,due:f.get('due'),priority:f.get('priority'),minutes:Number(f.get('minutes')),done:old?.done||false};tasks=old?tasks.map(x=>x.id===editId?t:x):[...tasks,t];save();$('#editor').close();render()};document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.page)goto(b.dataset.page);if(b.dataset.goto)goto(b.dataset.goto);if(b.dataset.edit)openEditor(b.dataset.edit);if(b.dataset.delete&&confirm('ลบงานนี้หรือไม่?')){tasks=tasks.filter(t=>t.id!==b.dataset.delete);save();render()}if(b.id==='reset'&&confirm('ล้างข้อมูลทั้งหมดหรือไม่?')){tasks=[];demo=false;save();render()}if(b.id==='export'){let url=URL.createObjectURL(new Blob([JSON.stringify({version:2,tasks,demo},null,2)],{type:'application/json'}));let a=document.createElement('a');a.href=url;a.download='studypilot-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}if(b.id==='import')$('#importFile').click()});document.addEventListener('change',e=>{let el=e.target;if(el.dataset.toggle){tasks=tasks.map(t=>t.id===el.dataset.toggle?{...t,done:el.checked}:t);save();render()}if(el.id==='filter'){filter=el.value;renderList()}});document.addEventListener('input',e=>{if(e.target.id==='search'){search=e.target.value;renderList()}});$('#importFile').onchange=async e=>{let file=e.target.files[0];if(!file)return;try{let d=JSON.parse(await file.text());if(!Array.isArray(d.tasks)||d.tasks.length>10000||!d.tasks.every(t=>typeof t.id==='string'&&typeof t.title==='string'&&t.title.trim()&&typeof t.subject==='string'&&t.subject.trim()&&typeof t.due==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(t.due)&&!isNaN(new Date(t.due+'T12:00:00'))&&Object.hasOwn(pri,t.priority)&&Number.isInteger(t.minutes)&&t.minutes>=5&&t.minutes<=1440&&typeof t.done==='boolean')||new Set(d.tasks.map(t=>t.id)).size!==d.tasks.length)throw Error('invalid');if(confirm('แทนที่ข้อมูลปัจจุบันด้วยไฟล์นี้หรือไม่?')){tasks=d.tasks;demo=!!d.demo;save();render()}}catch{alert('ไฟล์ไม่ถูกต้อง กรุณาเลือกไฟล์สำรอง StudyPilot V2')}finally{e.target.value=''}};load();render();
</script></body></html>
